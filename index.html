<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok Takip</title><link rel="stylesheet" href="style.css"></head><body>
<aside><h2>📦 Stok Takip</h2><button class="nav active" data-p="home">🏠 Ana Sayfa</button><button class="nav" data-p="products">📦 Ürünler</button><button class="nav" data-p="moves">🔄 Stok Hareketleri</button><button class="nav" data-p="parties">👥 Cari / Müşteriler</button><small>BTF Bilişim</small></aside>
<main><header><div><h1 id="title">Ana Sayfa</h1><span>Basit stok yönetimi</span></div><button id="refresh">↻ Yenile</button></header>
<section id="home" class="page"><div class="cards"><div><span>Toplam Ürün</span><b id="nprod">0</b></div><div><span>Kritik Stok</span><b id="ncrit">0</b></div><div><span>Toplam Stok</span><b id="nstock">0</b></div><div><span>Cari</span><b id="nparty">0</b></div></div><div class="box"><div class="head"><h2>Kritik Stoklar</h2><button onclick="productForm()">+ Ürün Ekle</button></div><div id="critical"></div></div></section>
<section id="products" class="page hide"><div class="box"><div class="head"><h2>Ürünler</h2><div><input id="search" placeholder="Kod veya ürün ara"><button onclick="productForm()">+ Ürün Ekle</button></div></div><div id="ptable"></div></div></section>
<section id="moves" class="page hide"><div class="box"><div class="head"><h2>Stok Hareketleri</h2><button onclick="moveForm()">+ Stok Hareketi</button></div><div id="mtable"></div></div></section>
<section id="parties" class="page hide"><div class="box"><div class="head"><h2>Cari / Müşteriler</h2><button onclick="partyForm()">+ Cari Ekle</button></div><div id="ctable"></div></div></section></main>
<div id="modal" class="modal hide"><div class="modalbox"><div class="head"><h2 id="mtitle"></h2><button onclick="closeM()">✕</button></div><form id="form"></form></div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
